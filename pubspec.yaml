name: drink_less_buddy
description: Evidence-based app to help people reduce alcohol consumption through self-monitoring, personalized feedback, and proven tactics.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # State Management
  provider: ^6.1.1

  # Backend & Database
  supabase_flutter: ^2.0.0

  # Local Storage
  shared_preferences: ^2.2.2
  hive: ^2.2.3
  hive_flutter: ^1.1.0

  # UI Components
  cupertino_icons: ^1.0.6
  flutter_svg: ^2.0.9
  intl: ^0.19.0
  fl_chart: ^0.66.0

  # Utilities
  uuid: ^4.2.1
  url_launcher: ^6.2.2

  # Premium Features (Stripe)
  flutter_stripe: ^10.1.1

  # Notifications
  flutter_local_notifications: ^18.0.1

  # HTTP
  http: ^1.1.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.1
  hive_generator: ^2.0.1
  build_runner: ^2.4.7

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/icons/
